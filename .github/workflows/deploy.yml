name: Deploy na AWS

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Buildar e Testar com JaCoCo
        run: mvn clean install

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir e Enviar Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USER }}/prova-final-ci:latest

      - name: Executar Deploy SSH na AWS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_TEST }}
          username: ubuntu
          key: ${{ secrets.KEY_TEST }}
          script: |
            # 1. Garantir que a rede bridge do Docker existe
            docker network create -d bridge rede || true

            # 2. Subir o PostgreSQL da aula se já não estiver rodando
            docker inspect postgres-aula >/dev/null 2>&1 || docker run -d --name postgres-aula -e POSTGRES_DB=auladb -e POSTGRES_USER=usuario -e POSTGRES_PASSWORD=senha --network=rede -p 5432:5432 postgres:15-alpine

            # 3. Parar e remover a versão anterior da API se existir
            docker stop prova-final-api || true
            docker rm prova-final-api || true

            # 4. Puxar a imagem nova do DockerHub
            docker pull ${{ secrets.DOCKER_USER }}/prova-final-ci:latest

            # 5. Subir a nova versão conectada à rede e ao banco
            docker run -d \
              --name prova-final-api \
              --network=rede \
              -p 8080:8080 \
              -e DB_HOST=postgres-aula \
              -e DB_USER=usuario \
              -e DB_PASSWORD=senha \
              ${{ secrets.DOCKER_USER }}/prova-final-ci:latest